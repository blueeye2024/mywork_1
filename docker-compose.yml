version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: cheongan-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      # 버전 정보를 빌드 시점에 주입 (deploy.sh에서 APP_VERSION 환경변수 제공)
      args:
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: cheongan-frontend
    restart: always
    ports:
      - "9200:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      # 런타임에서도 확인 가능하도록 환경변수 매핑
      - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-1.0.0}
    deploy:
      # resources:
      #   limits:
      #     cpus: '0.5'
      #     memory: 512M
    networks:
      - frontend-network
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
